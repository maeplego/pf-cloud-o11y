apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform

resources:
  - otel-collector.yaml
  - tempo.yaml
  - grafana.yaml

configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=otel-collector-config.yaml
  - name: tempo-config
    files:
      - tempo.yaml=tempo-config.yaml
  - name: grafana-datasources
    files:
      - datasources.yaml=grafana-datasources.yaml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yaml=grafana-dashboards.yaml
  - name: grafana-dashboards
    files:
      - media-api-traces.json=grafana-dashboard-media-traces.json

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: portfolio-integration
    includeSelectors: false
